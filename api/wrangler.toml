name = "gh-site-api-production"
main = "worker.js"
compatibility_date = "2026-07-27"

[vars]
CORS_ALLOW_ALL = "on"

# 额外的 CORS 来源（逗号分隔）。只在 CORS_ALLOW_ALL = "off" 时才需要登记。
CORS_EXTRA_ORIGINS = ""

# 封锁功能的安全白名单：逗号分隔的 IP / CIDR。
BLOCK_SAFE_IPS = ""

# Storage RPC 每页行数（上限 1000）；项目 db-max-rows 更小时调小。
STORAGE_RPC_PAGE_SIZE = "1000"

API_URL = "https://page.goose.cc.cd"
# 可写管理员（完整权限）：逗号分隔的 Supabase Auth 用户 UID。
ADMIN_USER_IDS = "de90a631-30b0-4b4a-afe4-dba9dd72e288,4ee286ea-945e-44ad-8513-6dc5d4ec2955"

# 只读管理员（只能看后台，所有写操作 403）：同样是逗号分隔的 UID。
# 不填或留空 = 不启用该功能，现有行为完全不变。
# 同一个 UID 若误填进两份名单，按「只读」处理（取权限更小的一方）。
ADMIN_READONLY_USER_IDS = "b45f7838-f6a4-45d6-a8a2-af4e363ce5c2,c6e486a2-89cb-4728-88ff-ca6bebc9d378"

AI_BASE_URL = "https://open.bigmodel.cn/api/paas/v4"
AI_MODEL = "glm-4.7-flash,glm-4.6,glm-4-flash"
AI_MAX_TOKENS = "4096"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "12b92271a0a44fa692fa99e2a639a5f9"

# API Key 存储
# Namespace: API_KEYS_KV
[[kv_namespaces]]
binding = "API_KEYS_KV"
id = "a660a8cd825a488abe4cb38620450578"

# Workers Rate Limiting bindings
# 官方文档：https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
[[ratelimits]]
name = "RL_10_10"
namespace_id = "8101"
[ratelimits.simple]
limit = 10
period = 10

[[ratelimits]]
name = "RL_10_60"
namespace_id = "8102"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "RL_100_60"
namespace_id = "8103"
[ratelimits.simple]
limit = 100
period = 60

[[ratelimits]]
name = "RL_20_60"
namespace_id = "8104"
[ratelimits.simple]
limit = 20
period = 60

[[ratelimits]]
name = "RL_40_60"
namespace_id = "8105"
[ratelimits.simple]
limit = 40
period = 60
