<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务状态 - GooseHost</title>
    <meta name="description" content="GooseHost 服务状态">
    <link rel="icon" type="image/x-icon" href="../icons/favicon.ico">
    <!-- 自建状态页已下线，统一跳转到 Upptime 状态页 -->
    <meta http-equiv="refresh" content="0; url=https://status.goose.cc.cd/">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f6f8fa;
            color: #24292f;
            font-family: 'DingTalk JinBuTi', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            font-size: 14px;
            padding: 24px;
        }
        .card {
            background: #fff;
            border: 1px solid #d0d7de;
            border-radius: 6px; /* 圆角一律 6px，禁止加大，禁止平滑大圆角 */
            box-shadow: 0 1px 0 rgba(27,31,36,0.04);
            padding: 28px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .card i { font-size: 26px; color: #0969da; margin-bottom: 12px; }
        .card h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .card p { color: #57606a; margin-bottom: 18px; }
        .card a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 6px; /* 圆角一律 6px，禁止加大，禁止平滑大圆角 */
            background: #1a7f37;
            border: 1px solid #1a7f37;
            color: #fff;
            font-weight: 500;
            text-decoration: none;
        }
        .card a:hover { background: #16692e; }
    </style>
</head>
<body>

        // 原自建状态页已删除，/status 现在直接跳转到新的 Upptime 状态页
