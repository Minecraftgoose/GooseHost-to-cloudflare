name: Deploy GooseHost Worker

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-goosehost-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build (esbuild 打包 index.js -> worker.js)
        run: npm run build

      - name: Push secrets to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ===== 新增：AI Copilot 的智谱密钥 =====
          # 在 GitHub 仓库 → Settings → Secrets and variables → Actions
          # 里新建 AI_API_KEYS，值填：key1,key2（英文逗号分隔，不要空格）
          AI_API_KEYS: ${{ secrets.AI_API_KEYS }}
          # ===== 新增：白云网盘 API Key =====
          # 在仓库 Actions secrets 里新建 PAN_API_KEY，值填你的白云网盘 Key。
          # 这是「快速部署一个」功能唯一的后端凭证，前端完全不接触。
          PAN_API_KEY: ${{ secrets.PAN_API_KEY }}
        run: |
          echo -n "${{ secrets.SUPABASE_URL }}" | npx wrangler secret put SUPABASE_URL
          echo -n "${{ secrets.SUPABASE_ANON_KEY }}" | npx wrangler secret put SUPABASE_ANON_KEY
          echo -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          echo -n "${{ secrets.CRON_SECRET }}" | npx wrangler secret put CRON_SECRET

          # AI Copilot —— 只有非空时才推送
          #
          # ⚠️ 为什么加这个判断：GitHub Actions 里未设置的 secret 会被展开成
          #    空字符串。若直接 echo -n "" | wrangler secret put AI_API_KEYS，
          #    会把「空值」写进 Cloudflare，**覆盖掉你在控制台配好的有效 key**，
          #    结果 Copilot 全部请求返回 500，而且很难排查。
          #
          # 所以：没配 AI_API_KEYS 就跳过这一步，保留 Cloudflare 上已有的值。
          if [ -n "$AI_API_KEYS" ]; then
            echo "Pushing AI_API_KEYS..."
            echo -n "$AI_API_KEYS" | npx wrangler secret put AI_API_KEYS
          else
            echo "AI_API_KEYS not set in repo secrets, skipping (keeping existing value on Cloudflare)"
          fi

          # ===== 白云网盘（快速部署 /f/:id 用）=====
          # 前端「快速部署一个」走的是 pan.ezv.cc，不上传 GooseHost 自己的存储。
          # 密钥同样只在 Cloudflare Worker 侧持有，前端拿不到。
          #
          # 注意：若未配置 PAN_API_KEY，前端卡片会自动隐藏、接口返回 503，
          # 已登录用户走 dashboard 的普通部署流程不受影响，可安全留空。
          if [ -n "$PAN_API_KEY" ]; then
            echo "Pushing PAN_API_KEY..."
            echo -n "$PAN_API_KEY" | npx wrangler secret put PAN_API_KEY
          else
            echo "PAN_API_KEY not set in repo secrets, skipping (quick deploy card will stay hidden)"
          fi

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
